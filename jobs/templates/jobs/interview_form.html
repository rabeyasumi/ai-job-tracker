<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} | Job Tracker</title>
    title>AI Job Analysis</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'jobs/style.css' %}">
</head>
<body>
    <h1>{{ page_title }}</h1>

    <p>
        Job: {{ application.job_title }} at {{ application.company_name }}
    </p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Save Interview</button>
    </form>

    <p>
        <a href="{% url 'interview_list' %}">Back to Interviews</a>
    </p>
</body>
</html>
