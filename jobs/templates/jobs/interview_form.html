<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} | Job Tracker</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'jobs/style.css' %}">
</head>
<body class="bg-container">

    <div class="card-container form-card">
        <!-- Header Section -->
        <header class="page-header">
            <h1 class="main-title">{{ page_title }}</h1>
            {% if application %}
                <p class="subtitle">
                    For <strong>{{ application.job_title }}</strong> at <strong>{{ application.company_name }}</strong>
                </p>
            {% endif %}
        </header>

        <!-- Form Section -->
        <form method="post" class="job-form">
            {% csrf_token %}

            <!-- Non-field Errors (if any) -->
            {% if form.non_field_errors %}
                <div class="alert alert-error">
                    {{ form.non_field_errors }}
                </div>
            {% endif %}

            <!-- Render Form Fields with Custom Wrapper -->
            <div class="form-fields-wrapper">
                {{ form.as_p }}
            </div>

            <!-- Form Action Buttons -->
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    💾 Save Interview
                </button>
                <a href="{% url 'interview_list' %}" class="btn btn-secondary">
                    Cancel
                </a>
            </div>
        </form>

        <!-- Footer Back Link -->
        <footer class="card-footer">
            <a href="{% url 'interview_list' %}" class="btn-back">
                ← Back to Interviews
            </a>
        </footer>
    </div>

</body>
</html>
