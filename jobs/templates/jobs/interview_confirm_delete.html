<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Interview</title>
    title>AI Job Analysis</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'jobs/style.css' %}">
</head>
<body>
    <h1>Delete Interview</h1>

    <p>
        Are you sure you want to delete the interview for
        {{ interview.application.job_title }} at
        {{ interview.application.company_name }}?
    </p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
        <a href="{% url 'interview_list' %}">Cancel</a>
    </form>
</body>
</html>
